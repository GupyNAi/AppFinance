<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis Finanzas</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1720">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201d;--mu:#66756f;--in:#0f8a5f;--out:#d64545;--sv:#2b6cd6;--iv:#8a54c9;--bd:#e1e7e4;--ac:#0f6b5c}
:root[data-t=dark]{--bg:#0f1720;--card:#18232e;--tx:#e8efec;--mu:#8fa19a;--in:#3ecf8e;--out:#ff7a7a;--sv:#6aa3ff;--iv:#b98cf0;--bd:#263544;--ac:#3ecf8e}
@media(prefers-color-scheme:dark){:root[data-t=auto]{--bg:#0f1720;--card:#18232e;--tx:#e8efec;--mu:#8fa19a;--in:#3ecf8e;--out:#ff7a7a;--sv:#6aa3ff;--iv:#b98cf0;--bd:#263544;--ac:#3ecf8e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
main{max-width:560px;margin:auto;padding:14px}h2{font-size:18px;margin:18px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}.big{font-size:34px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}.n{font-size:20px;font-weight:650}
.bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--sv)}
button,input,select{font:inherit;color:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;min-height:48px}button.s{background:var(--bd);color:var(--tx)}button.d{background:var(--out)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);min-height:48px;margin:4px 0 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:16px;bottom:76px;width:60px;height:60px;border-radius:30px;font-size:30px;padding:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.in{color:var(--in)}.out{color:var(--out)}.sv{color:var(--sv)}.iv{color:var(--iv)}.al{background:#d6454522;border-radius:12px;padding:10px;margin:6px 0}
.sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}.sh>div{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto}
.tp{display:flex;gap:6px;margin-bottom:10px}.tp button{flex:1;padding:10px 4px;background:var(--bd);color:var(--tx);font-size:14px}.tp button.on{background:var(--ac);color:#fff}
</style></head><body><main id="m"></main><button class="fab" onclick="addTx()" aria-label="Agregar movimiento">+</button>
<nav id="nv"></nav><div id="sh"></div>
<script src="core.js"></script>
<script>
const $=s=>document.querySelector(s),fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('es-CO'),C=Core,CAT=C.CATS;
let S,tab='home',vm=new Date(),nid=()=>Date.now()+Math.floor(Math.random()*1e3);
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('fin',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){const d=await idb();return new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>r(g.result)})}
async function persist(){const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(S,'s');if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
const num=v=>Math.max(0,Math.round(Number(String(v).replace(/\D/g,''))||0));
const tl={in:'Ingreso',out:'Gasto',save:'Ahorro',inv:'Inversión'};
function sheet(h){$('#sh').innerHTML=h?'<div class="sh"><div>'+h+'</div></div>':''}
function lt(ts){const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function addTx(id){const t=id?S.tx.find(x=>x.id===id):{type:'out',ts:Date.now(),amt:'',cat:'dia',goal:'emer',desc:''};window._t={...t};txForm(id)}
function txForm(id){const t=window._t;sheet(`<div class="tp">${Object.keys(tl).map(k=>`<button class="${t.type===k?'on':''}" onclick="_t.type='${k}';_t.amt=num($('#a').value);_t.desc=$('#d').value;txForm(${id||0})">${tl[k]}</button>`).join('')}</div>
<input id="a" inputmode="numeric" placeholder="Monto en COP" value="${t.amt}">
${t.type==='out'?`<select id="c">${Object.keys(CAT).filter(k=>C.SPEND.includes(k)).map(k=>`<option value="${k}" ${t.cat===k?'selected':''}>${CAT[k]}</option>`).join('')}</select>`:''}
${t.type==='save'?`<select id="g"><option value="emer">Fondo de emergencia</option>${S.goals.filter(g=>!g.done).map(g=>`<option value="${g.id}" ${t.goal==g.id?'selected':''}>${g.name}</option>`).join('')}</select>`:''}
<input id="d" placeholder="Descripción (opcional)" value="${t.desc||''}"><input id="w" type="datetime-local" value="${lt(t.ts)}">
<p id="e" class="out"></p><button onclick="saveTx(${id||0})" style="width:100%">Guardar</button> <button class="s" onclick="sheet()" style="width:100%;margin-top:8px">Cancelar</button>`)}
function saveTx(id){const t=window._t,a=num($('#a').value);if(!a)return $('#e').textContent='Escribe un monto mayor a cero.';
 const n={id:id||nid(),type:t.type,amt:a,ts:new Date($('#w').value).getTime()||Date.now(),desc:$('#d').value.trim()};
 if(t.type==='out')n.cat=$('#c').value;if(t.type==='save')n.goal=$('#g').value==='emer'?'emer':Number($('#g').value);
 if((t.type==='save'||t.type==='inv')&&!C.canReserve(S,a,id))return $('#e').textContent='No tienes ese dinero libre para apartar.';
 if(id)S.tx=S.tx.map(x=>x.id===id?n:x);else S.tx.push(n);persist();sheet();draw()}
function delTx(id){if(confirm('¿Eliminar este movimiento? Los saldos se recalcularán.')){S.tx=S.tx.filter(x=>x.id!==id);persist();draw()}}
function form(h,f,ok){sheet(`<h2>${h}</h2>${f.map(x=>`<label class="mu">${x[1]}</label><input id="f_${x[0]}" ${x[2]||''} value="${x[3]||''}">`).join('')}<button onclick="${ok}()" style="width:100%">Guardar</button> <button class="s" onclick="sheet()" style="width:100%;margin-top:8px">Cancelar</button>`)}
function goalForm(id){const g=S.goals.find(x=>x.id===id)||{};window.gOk=()=>{const n=$('#f_n').value.trim(),t=num($('#f_t').value),d=$('#f_d').value;if(!n||!t||!d)return alert('Completa nombre, monto y fecha.');const o={id:id||nid(),name:n,target:t,deadline:d,prio:Number($('#f_p').value)||2,paused:!!g.paused,done:!!g.done};S.goals=id?S.goals.map(x=>x.id===id?o:x):S.goals.concat(o);persist();sheet();draw()};
 form(id?'Editar meta':'Nueva meta',[['n','Nombre','',g.name],['t','Cantidad objetivo (COP)','inputmode=numeric',g.target],['d','Fecha límite','type=date',g.deadline],['p','Prioridad (1 alta, 3 baja)','inputmode=numeric',g.prio||2]],'gOk')}
function billForm(){window.bOk=()=>{const n=$('#f_n').value.trim(),a=num($('#f_a').value);if(!n||!a)return;S.bills.push({id:nid(),name:n,amt:a});persist();sheet();draw()};form('Nueva obligación mensual',[['n','Nombre (ej. arriendo)'],['a','Monto mensual (COP)','inputmode=numeric']],'bOk')}
const bars=(v,t,c)=>`<div class="bar"><i style="width:${t?Math.min(100,100*v/t):0}%;${c?'background:'+c:''}"></i></div>`;
function home(){const r=C.summary(S,Date.now()),A=[];
 for(const c of ['gus','hab']){const[dl,ml]=S.lim[c],td=S.tx.filter(t=>t.type==='out'&&t.cat===c&&new Date(t.ts).toDateString()===new Date().toDateString());if(dl&&C.sum(td)>dl)A.push(CAT[c]+': pasaste el límite diario ('+fmt(dl)+').');if(ml&&r.used[c]>ml)A.push(CAT[c]+': pasaste el límite mensual ('+fmt(ml)+').')}
 for(const c of ['ali','dia','gus','hab'])if(r.alloc[c]&&r.used[c]>r.alloc[c])A.push(CAT[c]+': gastaste '+fmt(r.used[c]-r.alloc[c])+' más de lo apartado.');
 if(r.leftToday<0)A.push('Hoy superaste tu límite por '+fmt(-r.leftToday)+'; se reparte en los días restantes.');
 if(!S.lastBackup)A.push('Aún no has creado una copia de seguridad. Ve a Más › Copia de seguridad.');
 return `${A.map(a=>`<div class="al">${a}</div>`).join('')}<div class="c"><div class="mu">Puedes gastar hoy</div><div class="big ${r.leftToday<0?'out':''}">${fmt(r.leftToday)}</div><div class="mu">Límite diario ${fmt(r.dailyBase)} · quedan ${r.daysLeft} días</div></div>
 <div class="g"><div class="c"><div class="mu">Saldo real</div><div class="n">${fmt(r.real)}</div></div><div class="c"><div class="mu">Reservado</div><div class="n">${fmt(r.reserved)}</div></div>
 <div class="c"><div class="mu">Disponible</div><div class="n">${fmt(r.avail)}</div></div><div class="c"><div class="mu">Obligaciones pendientes</div><div class="n">${fmt(r.oblPending)}</div></div>
 <div class="c"><div class="mu">Ingresos del mes</div><div class="n in">${fmt(r.income)}</div></div><div class="c"><div class="mu">Gastos del mes</div><div class="n out">${fmt(r.spent)}</div></div>
 <div class="c"><div class="mu">Ahorro en metas</div><div class="n sv">${fmt(r.goalsSaved)}</div></div><div class="c"><div class="mu">Fondo de emergencia</div><div class="n sv">${fmt(r.emerSaved)}</div>${S.emerTarget?bars(r.emerSaved,S.emerTarget):''}</div>
 <div class="c"><div class="mu">Invertido</div><div class="n iv">${fmt(r.invested)}</div></div><div class="c"><div class="mu">Puedes invertir</div><div class="n iv">${fmt(r.investable)}</div>${r.emerOk?'':'<div class="mu">Primero completa tu fondo de emergencia.</div>'}</div></div>
 <h2>Metas</h2>${S.goals.filter(g=>!g.done).map(g=>{const sv=C.sum(S.tx.filter(t=>t.type==='save'&&t.goal===g.id));return`<div class="c"><b>${g.name}</b> <span class="mu">${fmt(sv)} de ${fmt(g.target)}</span>${bars(sv,g.target)}</div>`}).join('')||'<p class="mu">Aún no tienes metas. Crea una en la pestaña Metas.</p>'}`}
function movs(){const ym=C.mkey(vm),L=S.tx.filter(t=>C.mkey(t.ts)===ym).sort((a,b)=>b.ts-a.ts);
 return `<input type="month" value="${ym}" onchange="vm=new Date(this.value+'-15');draw()">${L.map(t=>`<div class="row"><div><b class="${t.type}">${t.type==='in'?'+':t.type==='out'?'-':''}${fmt(t.amt)}</b> <span class="mu">${tl[t.type]}${t.cat?' · '+CAT[t.cat]:t.goal?' · '+(t.goal==='emer'?'Emergencia':(S.goals.find(g=>g.id===t.goal)||{}).name||'Meta'):''}</span><div class="mu">${new Date(t.ts).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'})} ${t.desc||''}</div></div><div><button class="s" onclick="addTx(${t.id})">✎</button> <button class="s" onclick="delTx(${t.id})">🗑</button></div></div>`).join('')||'<p class="mu">Sin movimientos este mes.</p>'}`}
function metas(){return `<button onclick="goalForm()" style="width:100%">Nueva meta</button>${S.goals.slice().sort((a,b)=>a.prio-b.prio).map(g=>{const sv=C.sum(S.tx.filter(t=>t.type==='save'&&t.goal===g.id)),n=C.goalNeed(g,sv,Date.now());return`<div class="c"><b>${g.name}</b> ${g.done?'✓ completada':g.paused?'(en pausa)':''}<div class="mu">${fmt(sv)} de ${fmt(g.target)} · prioridad ${g.prio} · hasta ${g.deadline}</div>${bars(sv,g.target)}${g.done||g.paused?'':`<div class="mu">Para llegar: ${fmt(n.day)}/día · ${fmt(n.week)}/semana · ${fmt(n.month)}/mes</div>`}<button class="s" onclick="goalForm(${g.id})">Editar</button> <button class="s" onclick="gt(${g.id},'paused')">${g.paused?'Reanudar':'Pausar'}</button> <button class="s" onclick="gt(${g.id},'done')">${g.done?'Reabrir':'Completar'}</button> <button class="s" onclick="gdel(${g.id})">🗑</button></div>`}).join('')}`}
function gt(id,k){const g=S.goals.find(x=>x.id===id);g[k]=!g[k];persist();draw()}
function gdel(id){if(confirm('¿Eliminar la meta? Sus aportes quedarán como ahorro en Fondo de emergencia.')){S.tx.forEach(t=>{if(t.goal===id)t.goal='emer'});S.goals=S.goals.filter(g=>g.id!==id);persist();draw()}}
function mas(){const r=C.summary(S,vm.getTime()),tot=Object.keys(S.pct).reduce((a,k)=>a+S.pct[k],0),mx=Math.max(1,...C.SPEND.map(k=>r.used[k]));
 return `<h2>Estadísticas de ${C.mkey(vm)}</h2><div class="c">Ahorrado: <b>${r.saveRate}%</b> de tus ingresos${C.SPEND.map(k=>`<div class="mu" style="margin-top:8px">${CAT[k]} · ${fmt(r.used[k])}</div>${bars(r.used[k],mx,k==='gus'||k==='hab'?'var(--out)':'')}`).join('')}${(()=>{const x=r.used.gus+r.used.hab;return x?`<p class="mu">Gustos y hábitos suman ${fmt(x)} este mes; reducirlos a la mitad liberaría ${fmt(Math.round(x/2))}.</p>`:''})()}</div>
 <h2>Distribución (${tot}%)</h2><div class="c"><p class="mu">Se aplica a lo que ganas en el mes, en este orden. Las obligaciones nunca quedan por debajo de su monto real.</p>${S.prio.map((k,i)=>`<div class="row"><span>${CAT[k]}</span><span><input style="width:80px;display:inline;margin:0" inputmode="numeric" value="${S.pct[k]}" onchange="S.pct['${k}']=num(this.value);persist();draw()">% <button class="s" onclick="mv(${i},-1)">↑</button> <button class="s" onclick="mv(${i},1)">↓</button></span></div>`).join('')}${tot>100?'<div class="al">La suma supera 100%: se aparta en orden de prioridad hasta agotar el ingreso.</div>':''}</div>
 <h2>Ajustes</h2><div class="c"><label class="mu">Dinero inicial (COP)</label><input inputmode="numeric" value="${S.initial}" onchange="S.initial=num(this.value);persist();draw()"><label class="mu">Meta del fondo de emergencia</label><input inputmode="numeric" value="${S.emerTarget}" onchange="S.emerTarget=num(this.value);persist();draw()">
 ${['gus','hab'].map(k=>`<label class="mu">${CAT[k]}: límite diario y mensual (0 = sin límite)</label><div class="g"><input inputmode="numeric" value="${S.lim[k][0]}" onchange="S.lim['${k}'][0]=num(this.value);persist();draw()"><input inputmode="numeric" value="${S.lim[k][1]}" onchange="S.lim['${k}'][1]=num(this.value);persist();draw()"></div>`).join('')}
 <label class="mu">Tema</label><select onchange="S.theme=this.value;persist();draw()">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(o=>`<option value="${o[0]}" ${S.theme===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <h2>Obligaciones mensuales</h2><div class="c">${S.bills.map(b=>`<div class="row"><span>${b.name}</span><span>${fmt(b.amt)} <button class="s" onclick="S.bills=S.bills.filter(x=>x.id==${b.id}?0:1);persist();draw()">🗑</button></span></div>`).join('')}<button onclick="billForm()" style="width:100%;margin-top:8px">Agregar obligación</button></div>
 <h2>Inversión: lo básico</h2><div class="c mu">Invertir implica riesgo de perder dinero; ningún rendimiento está garantizado. Evalúa la liquidez (qué tan rápido recuperas tu dinero) y el plazo. Esta app solo calcula cuánto podrías destinar sin afectar tus obligaciones ni tu fondo de emergencia.</div>
 <h2>Copia de seguridad</h2><div class="c"><p class="mu">Tus datos solo viven en este teléfono. Borrar los datos del navegador o desinstalar la app los elimina. ${S.lastBackup?'Última copia: '+new Date(S.lastBackup).toLocaleString('es-CO'):'No has creado ninguna copia.'}</p><button onclick="bk()" style="width:100%">Exportar copia (JSON)</button> <button class="s" onclick="dl('movimientos.csv',C.csv(S),'text/csv')" style="width:100%;margin-top:8px">Exportar movimientos (CSV)</button><label class="mu" style="display:block;margin-top:10px">Restaurar copia</label><input type="file" accept=".json" onchange="rs(this.files[0])"><button class="d" onclick="rst()" style="width:100%">Borrar todos los datos</button></div>`}
function mv(i,d){const p=S.prio,j=i+d;if(j<0||j>=p.length)return;[p[i],p[j]]=[p[j],p[i]];persist();draw()}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function bk(){S.lastBackup=Date.now();persist();dl('finanzas-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S),'application/json');draw()}
function rs(f){if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!Array.isArray(o.tx)||!o.pct)throw 0;if(confirm('Esto reemplaza los datos actuales. ¿Continuar?')){S={...C.DEF(),...o};persist();draw()}}catch(e){alert('El archivo no es una copia válida.')}})}
function rst(){if(confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')&&confirm('Última confirmación: ¿borrar todo?')){S=C.DEF();persist();draw()}}
function draw(){document.documentElement.dataset.t=S.theme;const T=[['home','Inicio'],['movs','Movimientos'],['metas','Metas'],['mas','Más']];
 $('#nv').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('');$('#m').innerHTML={home,movs,metas,mas}[tab]()}
(async()=>{S={...C.DEF(),...(await load()||{})};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
